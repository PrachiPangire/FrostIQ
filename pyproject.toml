[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frostiq"
version = "0.1.0"
description = "ML-based predictive cold-chain temperature monitoring"
readme = "README.md"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
